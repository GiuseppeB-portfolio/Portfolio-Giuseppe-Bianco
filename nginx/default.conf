server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Non rivela la versione di nginx
    server_tokens off;

    # Sito statico: ammesse solo letture
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # --- Header di sicurezza ---------------------------------
    # Nota: add_header in un blocco "location" annullerebbe quelli di questo
    # livello, quindi qui sotto nelle location si usa solo "expires".
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Da attivare SOLO quando il sito e' servito in HTTPS (ad esempio dal proxy/hosting):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Compressione ----------------------------------------
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain;

    # --- Percorsi --------------------------------------------
    # File nascosti (.git, .env, ...) mai serviti
    location ~ /\. {
        return 404;
    }

    # Pagine HTML: sempre rivalidate, cosi' gli aggiornamenti si vedono subito
    location ~* \.html$ {
        expires -1;
    }

    # Risorse statiche: cache breve (i nomi file non hanno versione)
    location ~* \.(css|js|svg|ico|png|jpg|jpeg|webp|woff2?)$ {
        expires 1h;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
